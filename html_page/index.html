<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="A directory of standalone pages published alongside hsufit.github.io."
    />
    <title>Standalone Pages</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f2eee6;
        --surface: rgba(255, 253, 248, 0.88);
        --text: #202722;
        --muted: #687169;
        --accent: #984634;
        --border: rgba(45, 58, 49, 0.16);
        --shadow: 0 18px 50px rgba(52, 42, 32, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(184, 91, 64, 0.13), transparent 34rem),
          var(--background);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(900px, calc(100% - 2rem));
        margin: 0 auto;
        padding: clamp(3rem, 9vw, 7rem) 0;
      }

      header {
        max-width: 640px;
        margin-bottom: 2.5rem;
      }

      .eyebrow {
        margin: 0 0 0.65rem;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .page-list {
        display: grid;
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .page-card {
        display: block;
        padding: clamp(1.4rem, 4vw, 2rem);
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
        text-decoration: none;
        transition:
          border-color 160ms ease,
          transform 160ms ease;
      }

      .page-card:hover {
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        transform: translateY(-2px);
      }

      .page-card:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .page-card h2 {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 1.8rem);
        line-height: 1.25;
      }

      .page-card p {
        margin: 0.65rem 0 0;
        color: var(--muted);
      }

      .meta {
        display: inline-block;
        margin-top: 1rem;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      footer {
        margin-top: 2.5rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #171b18;
          --surface: rgba(34, 40, 35, 0.9);
          --text: #edf1eb;
          --muted: #aeb8af;
          --accent: #e49a82;
          --border: rgba(230, 238, 231, 0.14);
          --shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">hsufit.github.io</p>
        <h1>Standalone Pages</h1>
        <p class="intro">
          Small, self-contained pages published alongside the main site.
          Titles retain the language used by each page.
        </p>
      </header>

      <ul class="page-list">
        <li>
          <a class="page-card" href="/html_page/tokyo-kyoto-2027/" lang="zh-Hant">
            <h2>京都・東京 2027 旅遊規劃</h2>
            <p>十個一日候選方案、和服花火選擇，以及十四天推薦行程。</p>
            <span class="meta">Travel plan · 2027</span>
          </a>
        </li>
      </ul>

      <footer>More pages will be added here as they are published.</footer>
    </main>
  </body>
</html>
